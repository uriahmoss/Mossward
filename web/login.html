<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Mossward</title><link rel="stylesheet" href="/styles.css"></head><body>
<main class="auth-shell"><section class="card auth-card"><p class="eyebrow">Mossward</p><h1>Sign in</h1>
<form id="login-form"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
<label for="code">Authenticator or recovery code</label><input id="code" autocomplete="one-time-code">
<button type="submit"><span>Sign in</span><span>→</span></button><p id="login-error" class="error"></p></form>
<button id="webauthn-login" type="button" class="compact-button">Sign in with a passkey or security key</button>
<div id="sso-providers"></div>
</section></main><script src="/login.js" defer></script></body></html>
