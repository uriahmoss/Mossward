<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Review Mossward network scans">
  <title>Network scans · Mossward</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="/" aria-label="Mossward home">
      <span class="wordmark-mark" aria-hidden="true">M</span>
      <span>Mossward</span>
    </a>
    <div class="header-actions"><a class="back-link" href="/account.html">Account</a><a class="back-link" href="/">← Home</a></div>
  </header>

  <main class="scan-shell">
    <section class="page-heading">
      <p class="eyebrow">Feature 01</p>
      <h1>Network scans</h1>
      <p>Review scan activity and open focused result views.</p>
    </section>

    <nav class="scan-section-nav" aria-label="Scan pages">
      <a class="active" href="/scan.html" aria-current="page">Recent scans</a>
      <a href="/scan-new.html">New scan</a>
    </nav>

    <section class="card results-card">
        <div class="card-heading">
          <div><span class="step-label">Activity</span><h2>Recent scans</h2></div>
          <a class="compact-button" href="/scan-new.html">Start scan</a>
        </div>
        <div id="scans" class="empty-state">
          <span class="empty-icon">○</span>
          <strong>No scans yet</strong>
          <span>Configure your first authorized scan to see activity here.</span>
        </div>
    </section>
  </main>
  <script src="/scan.js" defer></script>
</body>
</html>
