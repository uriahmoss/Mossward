name: PostgreSQL runtime verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: postgresql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  worker-windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Rehearse native low-privilege Windows worker
        env:
          MOSSWARD_TEST_WORKER_WINDOWS_SERVICE: '1'
        run: go test -race -count=1 -timeout=10m ./internal/workerapp -run '^TestNativeWindowsWorkerAcceptance$'
  worker-systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Rehearse native low-privilege systemd worker
        env:
          MOSSWARD_TEST_WORKER_SYSTEMD: '1'
        run: go test -race -count=1 -timeout=10m ./internal/workerapp -run '^TestNativeSystemdWorkerAcceptance$'
  verify:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            major: 16
            tools: /usr/lib/postgresql/16/bin
          - os: windows-2022
            major: 14
            tools: 'C:\Program Files\PostgreSQL\14\bin'
          - os: windows-2025
            major: 17
            tools: 'C:\Program Files\PostgreSQL\17\bin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify Linux native PostgreSQL
        if: runner.os == 'Linux'
        shell: bash
        env:
          POSTGRES_TOOLS: ${{ matrix.tools }}
          POSTGRES_MAJOR: ${{ matrix.major }}
        run: bash scripts/verify-postgres.sh --tools-dir "$POSTGRES_TOOLS" --expected-major "$POSTGRES_MAJOR"
      - name: Verify Windows native PostgreSQL
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          POSTGRES_TOOLS: ${{ matrix.tools }}
          POSTGRES_MAJOR: ${{ matrix.major }}
        run: ./scripts/Verify-PostgreSQL.ps1 -ToolsDirectory $env:POSTGRES_TOOLS -ExpectedMajor $env:POSTGRES_MAJOR
